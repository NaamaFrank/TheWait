<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07111e" />
  <meta name="description" content="Turn the wait for your model into something useful. Track LLM latency and see who else is waiting worldwide." />
  <title>The Wait</title>

  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/screens.css" />
</head>
<body>
  <div class="app-shell" id="shell">
    <header class="app-bar">
      <span class="app-mark" aria-hidden="true"></span>
      <span class="app-name">The Wait</span>
      <span class="device-tag" id="deviceTag" title="Your anonymous device id">…</span>
    </header>

    <main class="screens" id="screens"></main>
  </div>

  <noscript>
    <p class="noscript">The Wait needs JavaScript to run the timer and the globe.</p>
  </noscript>

  <script type="module" src="js/main.js"></script>

</html>
