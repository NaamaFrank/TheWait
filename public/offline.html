<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07111e" />
  <title>The Wait - Offline</title>
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <style>
    .offline {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-4);
      min-height: 100dvh;
      padding: var(--space-6);
      text-align: center;
    }

    .offline-orb {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 1px solid var(--border-bright);
      background: radial-gradient(circle at 35% 30%, rgba(125, 250, 255, 0.55), rgba(141, 109, 255, 0.2) 60%, transparent);
      box-shadow: var(--glow-cyan);
    }

    .offline h1 {
      font-size: var(--text-xl);
      font-weight: 600;
    }

    .offline p {
      max-width: 32ch;
      color: var(--text-muted);
      font-size: var(--text-sm);
      line-height: 1.5;
    }

    .offline button {
      min-height: 46px;
      padding: 0 var(--space-5);
      color: #04121c;
      background: linear-gradient(135deg, var(--cyan), var(--cyan-deep));
      border-radius: var(--radius-pill);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="offline">
    <span class="offline-orb" aria-hidden="true"></span>
    <h1>No connection</h1>
    <p>The Wait needs the server to log sessions and show the globe. Your logged waits are safe.</p>
    <button type="button" onclick="location.replace('/')">Try again</button>
  </main>
</body>
</html>
