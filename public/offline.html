<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14100F" />
  <title>The Wait - Offline</title>
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <style>
    .offline {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      min-height: 100dvh;
      padding: 32px 24px;
      text-align: center;
    }

    .offline-orb {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--hero);
      box-shadow: 0 6px 0 var(--hero-shadow);
    }

    .offline h1 {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 27px;
      color: var(--text);
    }

    .offline p {
      max-width: 32ch;
      color: var(--text-soft);
      font-size: 13px;
      line-height: 1.5;
      text-wrap: pretty;
    }
  </style>
</head>
<body>
  <main class="offline">
    <span class="offline-orb" aria-hidden="true"></span>
    <h1>No connection</h1>
    <p>The Wait needs the server to log your waits and show the globe. Everything you have already banked is safe.</p>
    <button type="button" class="btn btn-wide" style="max-width: 260px" onclick="location.replace('/')">Try again</button>
  </main>
</body>
</html>
